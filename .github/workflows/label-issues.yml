# Labels an issue from its form: the area, the operating system, and
# whether it's a regression. Runs when an issue is opened or edited.
# It only removes area: …, os: … and regression labels the form no longer
# asks for, so labels set by hand, such as documentation, stay.
name: Label issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const areas = {
              'Editor': 'area: editor',
              'Agent Chat and agents': 'area: agents',
              'AI completions (ghost text)': 'area: completions',
              'Languages (LSP, completion, diagnostics)': 'area: languages',
              'Flutter and Dart': 'p: lumide_flutter',
              'Git (C.O.R.G.I.)': 'area: git',
              'Terminal': 'area: terminal',
              'Files, tabs and panes': 'area: workspace',
              'O.W.L. board': 'area: owl',
              'Search and navigation': 'area: search',
              'Debugging and running': 'area: debugging',
              'Sharing a workspace': 'area: sharing',
              'Remote SSH': 'area: remote',
              'Plugins and Marketplace': 'area: plugins',
              'Themes and appearance': 'area: themes',
              'Settings and keymaps': 'area: settings',
              'Vim mode': 'area: vim',
              'Previews (Markdown, HTML, images)': 'area: previews',
              'Text input (IME, keyboard layouts)': 'area: input',
              'Install and updates': 'area: install',
              'Documentation': 'documentation',
            };
            const systems = {
              'macOS': 'os: macOS',
              'Windows': 'os: Windows',
              'Linux': 'os: Linux',
            };

            const issue = context.payload.issue;
            const body = issue.body || '';

            // A form's answer sits under its "### Label" heading.
            const answer = (heading) => {
              const match = body.match(
                new RegExp(`###\\s*${heading}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s|$)`),
              );
              return match ? match[1].trim() : '';
            };

            const wanted = new Set();
            const area = areas[answer('Area')];
            if (area) wanted.add(area);
            const system = systems[answer('Operating system')];
            if (system) wanted.add(system);
            if (/- \[x\] It worked in an earlier version/i.test(answer('Regression'))) {
              wanted.add('regression');
            }

            const managed = (name) =>
              name.startsWith('area: ') || name.startsWith('os: ') || name === 'regression';
            const current = issue.labels.map((label) => label.name);
            const toAdd = [...wanted].filter((name) => !current.includes(name));
            const toRemove = current.filter(
              (name) => managed(name) && !wanted.has(name),
            );

            // An issue not from a form (no answers at all) is left alone.
            if (wanted.size === 0 && !answer('Area') && !answer('Operating system')) {
              core.info('No form answers found; leaving the labels as they are.');
              return;
            }

            const target = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({ ...target, labels: toAdd });
            }
            for (const name of toRemove) {
              await github.rest.issues.removeLabel({ ...target, name });
            }
            core.info(`Added: ${toAdd.join(', ') || 'none'}. Removed: ${toRemove.join(', ') || 'none'}.`);
